# Network Server Configuration
# Critical infrastructure file — any modification should trigger an alert

# Listening interfaces
listen_address = 0.0.0.0
listen_port = 443
admin_port = 9090

# TLS Configuration
tls_enabled = true
tls_certificate = /etc/ssl/certs/server.pem
tls_private_key = /etc/ssl/private/server.key
tls_min_version = TLSv1.2

# Access Control
allow_remote_admin = false
trusted_proxies = 192.168.1.1, 10.0.0.1
rate_limit_per_ip = 60

# Session Management
session_timeout = 3600
max_concurrent_sessions = 50
session_cookie_secure = true
session_cookie_httponly = true

# Audit
audit_logging = true
audit_log_path = /var/log/server/audit.log
log_failed_auth = true
